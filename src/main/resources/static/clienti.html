<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clienți — Invoicing</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Registru de facturi</h1>
      <span class="ledger-no" id="client-count"></span>
    </header>

    <nav class="tabs">
      <a href="/index.html">Facturi</a>
      <a href="/clienti.html" class="active">Clienți</a>
      <a href="/produse.html">Produse</a>
    </nav>

    <div class="message" id="msg"></div>

    <section>
      <h2>Client nou</h2>

      <div class="field-row">
        <div class="field">
          <label for="name">Nume</label>
          <input type="text" id="name" placeholder="Andrei Popescu" />
        </div>
        <div class="field">
          <label for="taxId">CUI / CNP</label>
          <input type="text" id="taxId" placeholder="1900101123456" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="andrei@exemplu.com" />
      </div>

      <button type="button" id="submit-client">Adaugă client</button>
      <button type="button" class="secondary" id="cancel-edit-client" style="display:none;">Anulează</button>
    </section>

    <section>
      <h2>Clienți existenți</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nume</th>
            <th>CUI / CNP</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="clients-body"></tbody>
      </table>
      <p class="empty" id="clients-empty" style="display:none;">Niciun client adăugat încă.</p>
    </section>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/clienti.js"></script>
</body>
</html>
