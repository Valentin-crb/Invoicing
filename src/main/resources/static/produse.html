<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produse — Invoicing</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Registru de facturi</h1>
      <span class="ledger-no" id="product-count"></span>
    </header>

    <nav class="tabs">
      <a href="/index.html">Facturi</a>
      <a href="/clienti.html">Clienți</a>
      <a href="/produse.html" class="active">Produse</a>
    </nav>

    <div class="message" id="msg"></div>

    <section>
      <h2>Produs nou</h2>

      <div class="field">
        <label for="name">Denumire</label>
        <input type="text" id="name" placeholder="Consultanță IT" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="unitPrice">Preț unitar (lei)</label>
          <input type="number" id="unitPrice" step="0.01" min="0" placeholder="150.00" />
        </div>
        <div class="field">
          <label for="vatRate">Cotă TVA</label>
          <input type="number" id="vatRate" step="0.01" min="0" max="1" placeholder="0.19" />
        </div>
      </div>

      <button type="button" id="submit-product">Adaugă produs</button>
      <button type="button" class="secondary" id="cancel-edit-product" style="display:none;">Anulează</button>
    </section>

    <section>
      <h2>Produse existente</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Denumire</th>
            <th class="num">Preț unitar</th>
            <th class="num">TVA</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="products-body"></tbody>
      </table>
      <p class="empty" id="products-empty" style="display:none;">Niciun produs adăugat încă.</p>
    </section>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/produse.js"></script>
</body>
</html>
